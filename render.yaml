services:
  - type: web
    name: myveel
    runtime: node
    plan: free
    buildCommand: npm install && npm run deploy:build
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/tmp/myveel.db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: SEED_DEMO
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        generateValue: true
